name: Validate Bicep Templates

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  validate-bicep:

    name: Bicep Validation
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Install Azure CLI + Bicep CLI
      - name: Setup Bicep CLI
        run: |
          az bicep install
          az bicep version


      # 3. Validate Bicep files
      - name: Validate Bicep files
        shell: bash
        run: |
          echo "Searching for Bicep files..."

          files=$(find . -type f -name "*.bicep")

          if [ -z "$files" ]; then
            echo "No Bicep files found."
            exit 0
          fi

          for file in $files
          do
            echo "--------------------------------"
            echo "Validating: $file"

            az bicep build --file "$file" --stdout > /dev/null

            if [ $? -ne 0 ]; then
              echo "FAILED: $file"
              exit 1
            fi

            echo "PASSED: $file"
          done


      # 4. Run Bicep linter
      - name: Run Bicep lint
        shell: bash
        run: |
          echo "Running Bicep lint..."

          files=$(find . -type f -name "*.bicep")

          if [ -z "$files" ]; then
            echo "No Bicep files found."
            exit 0
          fi

          for file in $files
          do
            echo "Linting: $file"
            az bicep lint --file "$file"
          done